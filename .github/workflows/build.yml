name: Build OpenWispr for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install dependencies
        run: pnpm install
        working-directory: apps/desktop

      - name: Build frontend (Vite)
        run: pnpm build
        working-directory: apps/desktop

      - name: Debug - Check if dist was created
        run: |
          Write-Host "=== apps/desktop contents ==="
          Get-ChildItem -Path . 
          Write-Host "=== dist folder (if exists) ==="
          if (Test-Path "dist") { Get-ChildItem -Path dist } else { Write-Host "NO DIST FOLDER FOUND" }
          Write-Host "=== vite.config.ts contents ==="
          Get-Content vite.config.ts
          Write-Host "=== package.json devDependencies ==="
          Get-Content package.json | Select-String -Pattern "plugin-react|vite"
        working-directory: apps/desktop
        shell: pwsh

      - name: Debug - List apps/desktop after build
        run: Get-ChildItem -Recurse -Depth 2   # <-- change dir to Get-ChildItem
        working-directory: apps/desktop
        shell: pwsh

      - name: Debug - Show full tauri.conf.json
        run: Get-Content src-tauri/tauri.conf.json  # <-- show whole file, not just distDir
        working-directory: apps/desktop
        shell: pwsh

      - name: Debug - Check crates exist
        run: |
          Write-Host "=== Repo root contents ==="
          Get-ChildItem -Path D:\a\openwispr\openwispr
          Write-Host "=== crates folder ==="
          if (Test-Path "D:\a\openwispr\openwispr\crates") { 
            Get-ChildItem "D:\a\openwispr\openwispr\crates" 
          } else { 
            Write-Host "NO CRATES FOLDER FOUND" 
          }
        shell: pwsh  

      - name: Build Tauri app
        run: pnpm tauri build --verbose
        working-directory: apps/desktop

      - name: Debug - Run cargo check directly
        run: cargo check
        working-directory: apps/desktop/src-tauri        

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenWispr-Windows
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi