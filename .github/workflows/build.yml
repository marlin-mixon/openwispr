name: Build OpenWispr for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install dependencies
        run: pnpm install
        working-directory: apps/desktop

      - name: Build frontend (Vite)
        run: pnpm build
        working-directory: apps/desktop

      - name: Debug - List apps/desktop after build
        run: dir
        working-directory: apps/desktop

      - name: Debug - Show tauri.conf.json distDir
        run: Get-Content src-tauri/tauri.conf.json | Select-String "distDir"
        working-directory: apps/desktop
        shell: pwsh

      - name: Build Tauri app (no extra cd)
        run: pnpm tauri build
        working-directory: apps/desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenWispr-Windows
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi