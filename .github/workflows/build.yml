name: Build OpenWispr for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          override: true

      - name: Install dependencies (pnpm)
        run: pnpm install
        working-directory: apps/desktop

      - name: Build frontend
        run: pnpm build
        working-directory: apps/desktop

      - name: DEBUG - List apps/desktop contents
        run: dir
        working-directory: apps/desktop

      - name: DEBUG - Show tauri.conf.json distDir
        run: type src-tauri\tauri.conf.json | findstr distDir
        working-directory: apps/desktop

      - name: Build Tauri app (with clean)
        run: |
          cd src-tauri
          cargo clean
          cd ..
          pnpm tauri build
        working-directory: apps/desktop

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenWispr-Windows
          path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi